[package]
name = "overmax-data"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "overmax_data"
path = "src/lib.rs"

[[bin]]
name = "db_builder"
path = "src/bin/db_builder.rs"
required-features = ["db_builder"]


[features]
default = []
db_builder = ["dep:clap", "dep:rayon", "dep:image"]

[dependencies]
overmax-core = { path = "../overmax_core" }
overmax_cv = { path = "../overmax_cv" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1"
strsim = "0.11.1"
clap = { version = "4.6", features = ["derive"], optional = true }
rayon = { version = "1.10", optional = true }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"], optional = true }
reqwest = { version = "0.13.4", default-features = false, features = [
  "blocking",
  "json",
  "native-tls",
] }
sha2 = "0.10.8"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_System_LibraryLoader",
] }

[dev-dependencies]
tempfile = "3"


